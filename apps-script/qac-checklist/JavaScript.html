        { title: "III. ប្រព័ន្ធវាយតម្លៃសិស្ស និងគ្រូ", points: [ "មានសំណុំឯកសារតេស្តចូលរៀន", "មាននីតិវិធីក្នុងដំណើរការប្រឡង", "មានរៀបចំកាលវិភាគ ចុះអង្កេតការបង្រៀន" ] },
        { title: "IV. ការលើកកម្ពស់គុណភាព", points: [ "រៀបចំកម្មវិធី និងផែនការសកម្មភាព", "រៀបចំក្រុមប្រឹក្សា", "រៀបចំកម្មវិធីបណ្តុះបណ្តាល" ] },
        { title: "V. ការប្រើប្រាស់បណ្ណាល័យ កុំព្យូទ័រ និងបន្ទប់ពិសោធន៍", points: [ "មានគោលការណ៍ណែនាំពីការប្រើប្រាស់នៅបណ្ណាល័យ", "សិស្សត្រូវមានម៉ោងរៀនកុំព្យូទ័រ", "មានគោលការណ៍ណែនាំ ពីការប្រើប្រាស់បន្ទប់ពិសោធន៍" ] }
    ];

    // ============================================
    // Logic គ្រប់គ្រងកម្មវិធី
    // ============================================

    window.onload = function() {
        currentUserRole = 'User';
        document.getElementById('dashboard-container').style.display = 'flex';
        updateSidebarUserUI();
        fetchInitialData(currentSelectedYear);
    };

    window.changeQACYear = function(year) {
        currentSelectedYear = year;
        
        const badgeAll = document.getElementById('current-year-badge-all');
        if (badgeAll) badgeAll.textContent = 'Year ' + year;
        
        const badgeCheck = document.getElementById('current-year-badge-check');
        if (badgeCheck) badgeCheck.textContent = year;
        
        showToast('🔄 Loading data for Year ' + year + '...');
        fetchInitialData(year);
    };

    function showLogin() {
        document.getElementById('dashboard-container').style.display = 'none';
        document.getElementById('login-container').style.display = 'block';
        document.getElementById('login-msg').textContent = '';
    }

    function hideLogin() {
        document.getElementById('login-container').style.display = 'none';
        document.getElementById('dashboard-container').style.display = 'flex';
    }

    function handleLogin() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const msg = document.getElementById('login-msg');
        msg.textContent = 'កំពុងពិនិត្យ...';

        google.script.run.withSuccessHandler(function(res) {
            if (res.success) {
                if (res.role === 'Admin') {
                    currentUserRole = res.role;
                    updateSidebarUserUI(res.username);
                    hideLogin();
                    if (activeDept !== 'All') {
                         document.querySelector(`[data-dept="${activeDept}"]`).click();
                    }
                } else {
                    msg.textContent = 'គណនីនេះមិនមែនជា Admin ទេ!';
                }
            } else { msg.textContent = 'ឈ្មោះគណនី ឬ លេខសម្ងាត់មិនត្រឹមត្រូវ!'; }
        }).verifyLogin(user, pass);
    }

    function handleLogout() {
        currentUserRole = 'User'; 
        document.getElementById('username').value = ''; 
        document.getElementById('password').value = '';
        updateSidebarUserUI();
        
        if (activeDept !== 'All') {
             document.querySelector(`[data-dept="${activeDept}"]`).click();
        }
    }

    function updateSidebarUserUI(username = '') {
        const info = document.getElementById('user-info');
        const btnLogin = document.getElementById('btn-login-admin');
        const btnLogout = document.getElementById('btn-logout');

        if (currentUserRole === 'Admin') {
            info.style.display = 'block';
            info.innerHTML = `${username} (Admin)`;
            btnLogin.style.display = 'none';
            btnLogout.style.display = 'block';
        } else {
            info.style.display = 'none';
            info.innerHTML = '';
            btnLogin.style.display = 'block';
            btnLogout.style.display = 'none';
        }
    }

    const deptProgress = { 'Finance': {}, 'HR': {}, 'Admin & Facility': {}, 'KGE': {}, 'GEP': {}, 'ICT': {}, 'Marketing': {} };
    let activeDept = 'All';

    function getDeptFromItemKey(itemKey) {
        const prefix = itemKey.split('_')[1];
        const map = {
            'fin': 'Finance', 'hr': 'HR', 'adm': 'Admin & Facility',
            'kge': 'KGE', 'gep': 'GEP', 'ict': 'ICT', 'mkt': 'Marketing'
        };
        return map[prefix];
    }

    function fetchInitialData(year = '2026') {
        showToast('⏳ Loading Year ' + year + ' data...');
        google.script.run.withSuccessHandler(function(data) {
            window.serverProgress = data.progress || {};
            for (let k in fileStore) delete fileStore[k];
            for (let key in data.attachments) { fileStore[key] = data.attachments[key]; }
            precalculateProgress();
            showToast('✅ Data for Year ' + year + ' loaded');
            if (activeDept) document.querySelector(`[data-dept="${activeDept}"]`).click();
        }).getInitialData(year);
    }

    function precalculateProgress() {
        const depts = [
            { name: 'Finance', data: financeData, prefix: 'fin' }, { name: 'HR', data: hrData, prefix: 'hr' },
            { name: 'Admin & Facility', data: adminData, prefix: 'adm' }, { name: 'KGE', data: kgeData, prefix: 'kge' },
            { name: 'GEP', data: gepData, prefix: 'gep' }, { name: 'ICT', data: ictData, prefix: 'ict' }, { name: 'Marketing', data: marketingData, prefix: 'mkt' }
        ];

        depts.forEach(d => {
            let total = 0, checked = 0, fileCount = 0;
            d.data.forEach((sec, sIdx) => {
                sec.points.forEach((pt, pIdx) => {
                    const isSub = pt.length < 100 && ( pt.startsWith("A.") || pt.startsWith("B.") || pt.startsWith("C.") || /^\d+\.\s/.test(pt) || /^[០-៩]+\.[០-៩]+-/.test(pt) );
                    if (!isSub) {
                        total++;
                        const itemKey = `item_${d.prefix}_${sIdx}_${pIdx}`;
                        const hasFile = fileStore[itemKey] && fileStore[itemKey].length > 0;
                        if (hasFile) fileCount += fileStore[itemKey].length;
                        if ((window.serverProgress && window.serverProgress[itemKey]) || hasFile) checked++;
                    }
                });
            });

            if (deptProgress[d.name]) { deptProgress[d.name].checked = checked; deptProgress[d.name].total = total; deptProgress[d.name].files = fileCount; }
            if (total > 0) updateSidebarBadge(d.name, Math.round((checked / total) * 100));
        });
        updateAllBadge();
        refreshOverviewGrid();
    }

    const welcome = document.getElementById('welcome-viewer');
    const viewer = document.getElementById('checklist-viewer');
    const title = document.getElementById('check-dept-title');
    const content = document.getElementById('checklist-content');

    const tabs = document.querySelectorAll('#doc-dept-tabs .side-link');
    tabs.forEach(tab => {
        tab.addEventListener('click', (e) => {
            e.preventDefault();
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');

            activeDept = tab.dataset.dept;
            if (activeDept === 'All') showAllOverview();
            else {
                if (activeDept === 'Finance') renderDeptChecklist("Finance", financeData, "fin");
                else if (activeDept === 'HR') renderDeptChecklist("HR", hrData, "hr");
                else if (activeDept === 'Admin & Facility') renderDeptChecklist("Admin & Facility", adminData, "adm");
                else if (activeDept === 'ICT') renderDeptChecklist("ICT", ictData, "ict");
                else if (activeDept === 'Marketing') renderDeptChecklist("Marketing", marketingData, "mkt");
                else if (activeDept === 'GEP') renderDeptChecklist("GEP", gepData, "gep");
                else if (activeDept === 'KGE') renderDeptChecklist("KGE", kgeData, "kge");
            }
        });
    });

    function showAllOverview() {
        viewer.style.display = 'none';
        welcome.style.display = 'flex';
        refreshOverviewGrid();
    }

    function refreshOverviewGrid() {
        const grid = document.getElementById('dept-overview-grid');
        if (!grid) return;
        const depts = [
            { name: 'Finance', icon: '💰' }, { name: 'HR', icon: '👥' }, { name: 'Admin & Facility', icon: '🏢' }, 
            { name: 'KGE', icon: '🧸' }, { name: 'GEP', icon: '🎓' }, { name: 'ICT', icon: '💻' }, { name: 'Marketing', icon: '📢' }
        ];
        grid.innerHTML = '';
        depts.forEach(d => {
            const prog = deptProgress[d.name] || { checked: 0, total: 0, files: 0 };
            const pct = prog.total > 0 ? Math.round((prog.checked / prog.total) * 100) : 0;
            const hasData = prog.total > 0;
            const color = !hasData ? '#94a3b8' : pct === 100 ? '#16a34a' : '#2563eb';
            const bgRing = !hasData ? '#e2e8f0' : pct === 100 ? '#dcfce7' : '#dbeafe';
            const label = !hasData ? '0%' : pct + '%';

            grid.innerHTML += `
                <div class="overview-card" style="background:white; border-radius:12px; border:1px solid #e2e8f0; padding:1.2rem; cursor:pointer;" onclick="document.querySelector('[data-dept=\\\'${d.name}\\\']').click()">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.9rem;">
                        <span style="font-size:1.7rem; line-height: 1;">${d.icon}</span>
                        <span style="font-size:0.8rem; font-weight:800; color:${color}; background:${bgRing}; padding:3px 10px; border-radius:20px;">${label}</span>
                    </div>
                    <div style="font-size:1rem; font-weight:800; color:#1e293b; margin-bottom:0.7rem;">${d.name}</div>
                    <div style="background:#f1f5f9; border-radius:6px; height:6px; overflow:hidden;">
                        <div style="height:100%; width:${hasData ? pct : 0}%; background:${color};"></div>
                    </div>
                    <div style="display:flex; justify-content:space-between; font-size:0.75rem; margin-top:10px;">
                        <span style="color:#64748b; font-weight:500;">${hasData ? prog.checked + '/' + prog.total + ' items' : 'Coming soon'}</span>
                        <span style="color:var(--primary); font-weight:800;">📎 ${prog.files || 0} Files</span>
                    </div>
                </div>
            `;
        });
    }

    function renderDeptChecklist(deptTitle, data, keyPrefix) {
        welcome.style.display = 'none';
        viewer.style.display = 'block';
        title.innerText = deptTitle + " Department";
        content.innerHTML = '';
        const isAdmin = currentUserRole === 'Admin';
        
        const deptContent = document.createElement('div');
        deptContent.style = "display: flex; flex-direction: column; gap: 1rem;";

        data.forEach((sec, sIdx) => {
            const sectionDiv = document.createElement('div');
            sectionDiv.style = "background: white; border-radius: 8px; border: 1px solid #e2e8f0; overflow: hidden;";

            let pointsHtml = '';
            sec.points.forEach((pt, pIdx) => {
                const itemKey = `item_${keyPrefix}_${sIdx}_${pIdx}`;
                if (!fileStore[itemKey]) fileStore[itemKey] = [];
                const isSub = pt.length < 100 && ( pt.startsWith("A.") || pt.startsWith("B.") || pt.startsWith("C.") || /^\d+\.\s/.test(pt) || /^[០-៩]+\.[០-៩]+-/.test(pt) );

                if (isSub) {
                    pointsHtml += `<div style="background: #f8fafc; padding: 0.5rem 0.9rem; font-size: 0.8rem; font-weight: 700; color: #64748b; border-bottom: 1px solid #e2e8f0;">${pt}</div>`;
                } else {
                    const hasFile = fileStore[itemKey].length > 0;
                    const checkedState = ((window.serverProgress && window.serverProgress[itemKey]) || hasFile) ? 'checked' : '';
                    const attachBtnHtml = isAdmin ? `<button class="attach-btn" onclick="triggerAttach('${itemKey}')">📎 <span>Attach Evidence</span></button>` : '';

                    pointsHtml += `
                        <div class="check-item" data-item-key="${itemKey}" style="display: flex; align-items: flex-start; gap: 10px; padding: 0.6rem 0.9rem; border-bottom: 1px solid #f1f5f9;">
                            <input type="checkbox" onchange="updateProgress(this, '${itemKey}')" ${checkedState} style="width: 15px; height: 15px; margin-top: 2px; cursor: pointer;">
                            <div style="flex: 1; min-width: 0;">
                                <div style="font-size: 0.85rem; font-weight: 500; line-height: 1.4;">${pt}</div>
                                <div style="margin-top: 6px;">
                                    ${attachBtnHtml}
                                    <input type="file" multiple id="input_${itemKey}" style="display:none;" onchange="addFiles('${itemKey}', this)">
                                    <div class="file-tray" id="tray_${itemKey}"></div>
                                </div>
                            </div>
                        </div>
                    `;
                }
            });

            sectionDiv.innerHTML = `
                <div style="background: #f1f5f9; padding: 0.6rem 0.9rem; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
                    <h4 style="margin: 0; color: var(--primary); font-size: 0.9rem; font-weight: 800;">${sec.title}</h4>
                </div>
                <div class="section-points">${pointsHtml}</div>
            `;
            deptContent.appendChild(sectionDiv);
        });
        
        content.appendChild(deptContent);

        data.forEach((sec, sIdx) => {
            sec.points.forEach((pt, pIdx) => {
                const itemKey = `item_${keyPrefix}_${sIdx}_${pIdx}`;
                if (document.getElementById('tray_' + itemKey)) renderFileTray(itemKey);
            });
        });
        
        const prog = deptProgress[deptTitle];
        if (prog && prog.total > 0) {
            const pct = Math.round((prog.checked / prog.total) * 100);
            document.getElementById('progress-bar').style.width = pct + '%';
            document.getElementById('overall-progress').innerText = pct + '%';
        }
    }

    window.triggerAttach = function (itemKey) { document.getElementById('input_' + itemKey).click(); };

    window.addFiles = function (itemKey, input) {
        if (input.files.length === 0) return;
        showToast('⏳ Uploading file(s) for Year ' + currentSelectedYear + '...');
        
        const targetDept = getDeptFromItemKey(itemKey);
        
        Array.from(input.files).forEach(file => {
            const reader = new FileReader();
            reader.onload = function(e) {
                google.script.run.withSuccessHandler(function(res) {
                    if (res.success) {
                        if (!fileStore[itemKey]) fileStore[itemKey] = [];
                        fileStore[itemKey].push(res.attachment);
                        renderFileTray(itemKey);
                        showToast(`✅ Uploaded: ${file.name}`);
                        
                        const checkbox = document.querySelector(`.check-item[data-item-key="${itemKey}"] input[type="checkbox"]`);
                        if (checkbox && !checkbox.checked) checkbox.checked = true;
                        updateProgress(); 
                    } else showToast(`❌ Error: ${res.error}`);
                }).uploadAttachment(e.target.result, file.name, targetDept, itemKey, currentSelectedYear);
            };
            reader.readAsDataURL(file);
        });
        input.value = '';
    };

    window.renderFileTray = function (itemKey) {
        const tray = document.getElementById('tray_' + itemKey);
        if (!tray) return;
        const files = fileStore[itemKey] || [];
        const checkItem = tray.closest('.check-item');
        const btn = checkItem ? checkItem.querySelector('.attach-btn') : null;
        const isAdmin = currentUserRole === 'Admin';

        if (btn) {
            if (files.length > 0) {
                btn.classList.add('has-files'); btn.innerHTML = `➕ <span>Add More</span><span class="file-counter">${files.length}</span>`;
            } else {
                btn.classList.remove('has-files'); btn.innerHTML = `📎 <span>Attach Evidence</span>`;
            }
        }
        tray.innerHTML = '';

        files.forEach((entry, fIdx) => {
            const ext = entry.name.split('.').pop().toLowerCase();
            let iconClass = 'other', iconEmoji = '📄';
            if (['pdf'].includes(ext)) { iconClass = 'pdf'; iconEmoji = '📕'; }
            else if (['jpg', 'png', 'jpeg', 'webp'].includes(ext)) { iconClass = 'img'; iconEmoji = '🖼️'; }
            else if (['doc', 'docx', 'xls', 'xlsx'].includes(ext)) { iconClass = 'doc'; iconEmoji = '📘'; }

            let actionsHtml = `<button class="fc-btn preview-btn" onclick="previewCP('${entry.url}', '${entry.name.replace(/'/g, "\\'")}')">👁️</button> <button class="fc-btn download-btn" onclick="downloadFile('${entry.downloadUrl}', '${entry.name.replace(/'/g, "\\'")}')">⬇️</button>`;
            if (isAdmin) actionsHtml += `<button class="fc-btn edit-btn" onclick="editFile('${itemKey}', ${fIdx})">✏️</button> <button class="fc-btn delete-btn" onclick="deleteFile('${itemKey}', ${fIdx})">🗑️</button>`;

            tray.innerHTML += `<div class="file-card"><div class="file-card-icon ${iconClass}">${iconEmoji}</div><div class="file-card-info"><div class="file-card-name">${entry.name}</div><div class="file-card-size">${formatFileSize(entry.size)}</div></div><div class="file-card-actions">${actionsHtml}</div></div>`;
        });
    };

    window.editFile = function (itemKey, fileIndex) {
        const editInput = document.createElement('input'); editInput.type = 'file'; editInput.style.display = 'none';
        const targetDept = getDeptFromItemKey(itemKey);
        
        editInput.onchange = function () {
            if (this.files.length > 0) {
                showToast('⏳ Replacing file...');
                const newFile = this.files[0];
                const oldFileObj = fileStore[itemKey][fileIndex];
                const reader = new FileReader();
                reader.onload = function(e) {
                    google.script.run.withSuccessHandler(function(res) {
                        if (res.success) {
                            if (oldFileObj.id) google.script.run.deleteAttachment(oldFileObj.id);
                            fileStore[itemKey][fileIndex] = res.attachment; renderFileTray(itemKey); showToast('✏️ File replaced');
                        }
                    }).uploadAttachment(e.target.result, newFile.name, targetDept, itemKey, currentSelectedYear);
                };
                reader.readAsDataURL(newFile);
            }
            editInput.remove();
        };
        document.body.appendChild(editInput); editInput.click();
    };

    window.deleteFile = function (itemKey, fileIndex) {
        const fileObj = fileStore[itemKey][fileIndex];
        if (confirm("តើអ្នកពិតជាចង់លុបឯកសារនេះមែនទេ?")) {
            if (fileObj.id) {
                showToast('⏳ Deleting file...');
                google.script.run.withSuccessHandler(function(res) {
                    if (res.success) {
                        fileStore[itemKey].splice(fileIndex, 1); renderFileTray(itemKey); showToast('🗑️ Removed');
                        
                        const hasFile = fileStore[itemKey] && fileStore[itemKey].length > 0;
                        if (!hasFile && (!window.serverProgress || !window.serverProgress[itemKey])) {
                            const checkbox = document.querySelector(`.check-item[data-item-key="${itemKey}"] input[type="checkbox"]`);
                            if (checkbox) checkbox.checked = false;
                        }
                        updateProgress(); 
                    }
                }).deleteAttachment(fileObj.id);
            }
        }
    };

    window.downloadFile = function (url) { window.open(url, '_blank'); };
    window.formatFileSize = function (bytes) { if (!bytes) return '0 B'; if (bytes < 1024) return bytes + ' B'; if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB'; return (bytes / 1048576).toFixed(1) + ' MB'; };

    window.updateProgress = function (checkboxEl = null, itemKey = null) {
        if (checkboxEl !== null && itemKey !== null) {
            if (currentUserRole !== 'Admin') {
                checkboxEl.checked = !checkboxEl.checked;
                return showToast('❌ មានតែ Admin ប៉ុណ្ណោះដែលអាច Tick បាន!');
            }
            
            const hasFile = fileStore[itemKey] && fileStore[itemKey].length > 0;
            if (hasFile && !checkboxEl.checked) {
                checkboxEl.checked = true;
                return showToast('ℹ️ មានឯកសារ Upload រួចរាល់ មិនអាចដក Tick វិញបានទេ!');
            }
            
            if (window.serverProgress) window.serverProgress[itemKey] = checkboxEl.checked;
            google.script.run.saveProgress(itemKey, checkboxEl.checked, currentSelectedYear);
        }

        precalculateProgress();
        
        if (activeDept !== 'All') {
            const prog = deptProgress[activeDept];
            if (prog && prog.total > 0) {
                const pct = Math.round((prog.checked / prog.total) * 100);
                document.getElementById('progress-bar').style.width = pct + '%';
                document.getElementById('overall-progress').innerText = pct + '%';
            }
        }
    };

    function updateSidebarBadge(dept, percent) {
        const safeId = dept === 'Admin & Facility' ? 'Admin' : dept;
        const badge = document.getElementById('badge-' + safeId);
        const bar = document.getElementById('bar-' + safeId);
        if (!badge) return;
        badge.innerText = percent + '%';
        badge.style.background = percent === 100 ? '#dcfce7' : percent > 0 ? '#dbeafe' : '#f1f5f9';
        badge.style.color = percent === 100 ? '#16a34a' : percent > 0 ? '#2563eb' : '#94a3b8';
        if (bar) { bar.style.width = percent + '%'; bar.style.background = percent === 100 ? '#16a34a' : 'var(--primary)'; }
    }

    function updateAllBadge() {
        let tc = 0, tp = 0; Object.values(deptProgress).forEach(d => { tc += d.checked; tp += d.total; });
        const allBadge = document.getElementById('badge-All');
        if (allBadge && tp > 0) {
            const pct = Math.round((tc / tp) * 100); allBadge.innerText = pct + '%';
            allBadge.style.background = pct === 100 ? '#dcfce7' : '#dbeafe'; allBadge.style.color = pct === 100 ? '#16a34a' : '#2563eb';
        }
    }

    const cpModal = document.getElementById('checklistPreviewModal');
    const cpIframe = document.getElementById('cp-iframe');
    const cpNoPreview = document.getElementById('cp-no-preview');
    
    window.previewCP = function (url, filename) {
        document.getElementById('cp-filename').innerText = "Evidence: " + filename;
        let previewUrl = url;
        if (url && url.includes('drive.google.com/file/d/')) {
            const id = url.split('/d/')[1].split('/')[0];
            previewUrl = 'https://drive.google.com/file/d/' + id + '/preview';
        }
        const ext = filename.split('.').pop().toLowerCase();
        if (['pdf', 'jpg', 'png', 'jpeg', 'webp'].includes(ext) || (previewUrl && previewUrl.includes('drive.google.com'))) { 
            cpIframe.style.display = 'block'; 
            cpNoPreview.style.display = 'none'; 
            cpIframe.src = previewUrl; 
        } else { 
            cpIframe.style.display = 'none'; 
            cpNoPreview.style.display = 'flex'; 
        }
        cpModal.classList.add('active');
    };
    
    window.closeCP = function () { cpModal.classList.remove('active'); cpIframe.src = ''; };
    window.showToast = function (message) { const toast = document.getElementById('toast'); toast.innerText = message; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2500); };
</script>
